[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems76"
version = "0.76.0"
description = "Lane H76 multi-physics, Verduzco tilt, self-masked fracture continuation & 300 m submodular fault detection for DOE GEMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "rasterio>=1.3",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pyproj>=3.6",
]

[tool.setuptools.packages.find]
where = ["src", "vendor"]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor"]
testpaths = ["tests"]
