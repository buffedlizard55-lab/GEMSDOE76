name: GEMSDOE76 Verification & Deliverable Contract CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy rasterio scikit-learn lightgbm matplotlib pytest
      - name: Run shared-module unit tests & GeoTIFF deliverable contract audit
        run: pytest -v
